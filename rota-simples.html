<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rota de Entregas</title>
<style>
:root{
  --fundo:#07080B; --fundo2:#0E1117; --painel:#141922; --linha:#232B38;
  --texto:#F2F5F9; --fraco:#8A97AA;
  --acento:#FF6A00;      /* laranja de carga */
  --acento2:#00D9FF;     /* ciano de painel */
  --ok:#00E08A;          /* entregue */
  --alerta:#FFC400;
  --perigo:#FF3B4E;
  --sombra:0 8px 28px rgba(0,0,0,.55);
}
body.claro{
  --fundo:#EEF1F6; --fundo2:#FFFFFF; --painel:#FFFFFF; --linha:#D5DCE7;
  --texto:#0B0E14; --fraco:#5A6678;
  --acento:#E85500; --acento2:#0069D9; --ok:#00875A; --alerta:#B57900; --perigo:#D32338;
  --sombra:0 4px 16px rgba(16,24,40,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0 0 100px;background:var(--fundo);color:var(--texto);
  font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;
  transition:background .2s,color .2s}

/* cabecalho */
header{position:sticky;top:0;z-index:5;padding:18px 16px 16px;
  background:linear-gradient(140deg,var(--fundo2) 0%,var(--painel) 100%);
  border-bottom:1px solid var(--linha);
  box-shadow:0 1px 0 rgba(255,255,255,.03), var(--sombra)}
header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:linear-gradient(90deg,var(--acento),var(--acento2))}
h1{font-size:11px;margin:0 0 10px;color:var(--fraco);text-transform:uppercase;
  letter-spacing:.22em;font-weight:700}
.num{font-size:46px;font-weight:800;line-height:1;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:var(--texto)}
.num small{font-size:20px;color:var(--fraco);font-weight:700}
.leg{font-size:13px;color:var(--fraco);margin-top:6px}
.leg b{color:var(--acento)}

/* botao de tema */
.tema{position:fixed;top:14px;right:14px;z-index:50;width:42px;height:42px;padding:0;
  border-radius:50%;border:1px solid var(--linha);background:var(--painel);
  color:var(--texto);font-size:19px;line-height:1;box-shadow:var(--sombra)}

main{padding:16px}

/* botoes */
button{font-family:inherit;font-size:15px;border-radius:10px;border:1px solid transparent;
  background:var(--acento);color:#0A0A0A;font-weight:700;padding:14px 16px;cursor:pointer;
  transition:transform .06s,filter .15s}
button:active{transform:scale(.97)}
button.claro{background:transparent;color:var(--texto);border-color:var(--linha);
  padding:10px 12px;font-size:13px;font-weight:600}
button.verde{background:var(--ok);color:#04140D}
button.ir{background:transparent;color:var(--acento2);border-color:var(--acento2);
  padding:10px 16px;font-size:13px;font-weight:800;letter-spacing:.06em}
button.ir.on{background:var(--ok);border-color:var(--ok);color:#04140D}

/* abas */
.abas{display:flex;margin-bottom:12px;border:1px solid var(--linha);border-radius:10px;
  overflow:hidden;background:var(--painel)}
.aba{flex:1;background:transparent;color:var(--fraco);border:0;border-radius:0;
  padding:13px 6px;font-size:14px;font-weight:600}
.aba.on{background:linear-gradient(135deg,var(--acento),#FF9040);color:#0A0A0A;font-weight:800}

/* campo */
.campo{display:flex;gap:8px;margin-bottom:8px}
.campo input{flex:1;min-width:0;padding:14px;font-size:16px;border:1px solid var(--linha);
  border-radius:10px;background:var(--painel);color:var(--texto)}
.campo input::placeholder{color:var(--fraco)}
.campo input:focus{outline:2px solid var(--acento2);outline-offset:0;border-color:transparent}
.dica{font-size:12px;color:var(--fraco);margin:0 0 18px;line-height:1.45}

/* lista */
ul{list-style:none;margin:0;padding:0}
li{background:var(--painel);border:1px solid var(--linha);border-radius:12px;
  padding:12px 13px;margin-bottom:9px;display:flex;gap:11px;align-items:flex-start;
  box-shadow:var(--sombra)}
li.sel{border-color:var(--ok)}
li.sel .pos{color:var(--ok)}
li.ok{opacity:.45}
li.ok .txt div:first-child{text-decoration:line-through}
.pos{font-weight:800;color:var(--fraco);min-width:26px;padding-top:2px;
  font-variant-numeric:tabular-nums}
.txt{flex:1;word-break:break-word;font-weight:600}
.sub{font-size:12px;color:var(--fraco);margin-top:4px;font-weight:400}
.bt{display:flex;flex-direction:column;gap:6px}
a.mapa{font-size:13px;color:var(--acento2);text-decoration:none;border:1px solid var(--acento2);
  border-radius:10px;padding:10px 12px;text-align:center;display:block;font-weight:700}

/* rodape */
.rodape{position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--fundo2);border-top:1px solid var(--linha);
  padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:9px;
  box-shadow:0 -8px 24px rgba(0,0,0,.35)}
.rodape button{flex:1}

/* avisos */
.msg{background:rgba(255,59,78,.10);border:1px solid var(--perigo);color:var(--perigo);
  padding:12px;border-radius:10px;font-size:13px;margin-bottom:14px;line-height:1.5}
.rodapetxt{font-size:11px;color:var(--fraco);text-align:center;margin-top:20px;opacity:.7}

/* cartao da proxima entrega */
.proxima{position:relative;background:var(--painel);border:1px solid var(--linha);
  border-radius:14px;padding:18px 16px;margin-bottom:10px;overflow:hidden;
  box-shadow:var(--sombra)}
.proxima::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(180deg,var(--acento),var(--acento2))}
.proxima .rot{font-size:11px;color:var(--acento);font-weight:800;
  text-transform:uppercase;letter-spacing:.2em}
.proxima .end{font-size:23px;font-weight:800;line-height:1.25;margin:10px 0 8px;
  word-break:break-word;letter-spacing:-.01em}
.proxima .km{font-size:13px;color:var(--fraco);margin-bottom:16px;
  font-variant-numeric:tabular-nums}
.proxima .acoes{display:flex;gap:9px}
.proxima .acoes a,.proxima .acoes button{flex:1;padding:16px 8px;font-size:15px;
  text-align:center;border-radius:11px;text-decoration:none;display:block;font-weight:800}
.proxima .acoes a{background:var(--acento2);color:#04121A;border:1px solid var(--acento2)}
.casa{background:var(--painel);border:1px solid var(--linha);border-radius:12px;
  padding:13px 14px;margin-bottom:14px;box-shadow:var(--sombra)}
.casa .rot{font-size:11px;color:var(--acento);font-weight:800;text-transform:uppercase;
  letter-spacing:.18em;margin-bottom:9px}
.casa .atual{display:flex;align-items:center;gap:10px}
.casa .nome{flex:1;font-weight:700;word-break:break-word;font-size:15px}
.casa .nome small{display:block;font-weight:400;color:var(--fraco);font-size:12px;margin-top:3px}
.prev{background:var(--painel);border:1px solid var(--linha);border-radius:14px;
  padding:16px;margin-bottom:14px;box-shadow:var(--sombra);position:relative;overflow:hidden}
.prev::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--acento2),var(--acento))}
.prev .rot{font-size:11px;color:var(--acento2);font-weight:800;text-transform:uppercase;
  letter-spacing:.2em;margin-bottom:12px}
.prev .grade{display:flex;gap:10px;margin-bottom:12px}
.prev .cel{flex:1;background:var(--fundo);border:1px solid var(--linha);border-radius:10px;padding:11px 12px}
.prev .cel .v{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.prev .cel .r{font-size:10px;color:var(--fraco);text-transform:uppercase;
  letter-spacing:.14em;font-weight:700;margin-top:6px}
.prev .quebra{font-size:12px;color:var(--fraco);line-height:1.6}
.prev .ajustes{display:none;border-top:1px solid var(--linha);margin-top:12px;padding-top:12px}
.prev .ajustes.on{display:block}
.linhaAj{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.linhaAj label{font-size:13px;color:var(--fraco);flex:1}
.linhaAj input{width:88px;padding:9px;font-size:15px;text-align:center;border-radius:8px;
  border:1px solid var(--linha);background:var(--fundo);color:var(--texto);
  font-variant-numeric:tabular-nums}
.btAj{width:100%;background:transparent;border:1px dashed var(--linha);color:var(--fraco);
  font-size:12px;font-weight:700;padding:9px;letter-spacing:.06em}
.pill{width:100%;margin-bottom:12px;background:transparent;border:1px dashed var(--linha);
  color:var(--fraco);font-size:12px;font-weight:700;padding:10px;letter-spacing:.06em}
.pill.on{border-style:solid;border-color:var(--acento2);color:var(--acento2)}
.tit{font-size:11px;color:var(--fraco);text-transform:uppercase;letter-spacing:.2em;
  margin:24px 0 10px;font-weight:700}
.fim{background:rgba(0,224,138,.10);border:1px solid var(--ok);color:var(--ok);
  padding:26px 18px;border-radius:14px;text-align:center;font-size:17px;font-weight:800}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<button class="tema" id="tema" title="Trocar entre claro e escuro">☀</button>

<!-- ======== TELA 1: CADASTRO ======== -->
<div id="tela1">
  <header>
    <h1>Entregas cadastradas</h1>
    <div class="num" id="num1">0<small>/0</small></div>
    <div class="leg" id="leg1">nenhuma entrega cadastrada</div>
  </header>
  <main>
    <div class="msg" id="msg" style="display:none"></div>

    <div class="abas">
      <button id="abaEnd" class="aba on">Por endereço</button>
      <button id="abaCoo" class="aba">Por coordenadas</button>
    </div>
    <div class="campo">
      <input id="cx" placeholder="Rua, número, bairro, cidade">
      <button id="add">Adicionar</button>
    </div>
    <p class="dica" id="dica">Digite o endereço completo com a cidade. O app procura no mapa sozinho.</p>

    <button id="btHist" class="pill" style="margin-bottom:14px"></button>
    <div id="casa"></div>
    <div id="prev1"></div>
    <ul id="lista1"></ul>
    <p class="rodapetxt">versão 13 · sequência antes de sair</p>
  </main>
  <div class="rodape">
    <button id="btatualizar" class="claro" style="padding:14px">Atualizar rota</button>
    <button id="btiniciar">Iniciar rota</button>
    <button id="btlimpa" class="claro" style="flex:0 0 74px;padding:14px">Limpar</button>
  </div>
</div>

<!-- ======== TELA 3: HISTÓRICO ======== -->
<div id="tela3" style="display:none">
  <header>
    <h1>Histórico de viagens</h1>
    <div class="num" id="num3">0</div>
    <div class="leg" id="leg3"></div>
  </header>
  <main>
    <div id="resumo3"></div>
    <ul id="lista3"></ul>
  </main>
  <div class="rodape">
    <button id="btvoltar3" class="claro" style="padding:14px">Voltar</button>
    <button id="btlimpahist" class="claro" style="flex:0 0 110px;padding:14px">Apagar tudo</button>
  </div>
</div>

<!-- ======== TELA 2: ROTA ======== -->
<div id="tela2" style="display:none">
  <header>
    <h1>Rota em andamento</h1>
    <div class="num" id="num2">0<small>/0</small></div>
    <div class="leg" id="leg2"></div>
  </header>
  <main>
    <div id="prev2"></div>
    <button id="btauto" class="pill"></button>
    <div id="blocoProxima"></div>
    <div class="tit" id="titDepois" style="display:none">Depois dessa</div>
    <ul id="lista2"></ul>
  </main>
  <div class="rodape">
    <button id="btvoltar" class="claro" style="padding:13px">Voltar ao cadastro</button>
    <button id="btrefazer">Refazer daqui</button>
  </div>
</div>

<script>
var paradas = [];
var modo = 'endereco';
var fila = [], buscando = false;

/* ---------- guardar ---------- */
var destinoFinal = null;   /* onde a rota deve terminar (sua casa) */
var sequenciaPronta = false;  /* true depois de calcular a ordem na tela 1 */

function salvar(){
  try{
    localStorage.setItem('rota_v5', JSON.stringify(paradas));
    localStorage.setItem('destino_final', JSON.stringify(destinoFinal));
  }catch(e){}
}
function carregar(){
  try{ var d = JSON.parse(localStorage.getItem('rota_v5')); if(d) paradas = d; }
  catch(e){ paradas = []; }
  try{ destinoFinal = JSON.parse(localStorage.getItem('destino_final')) || null; }catch(e){}
}
function msg(t){
  var m = document.getElementById('msg');
  if(!t){ m.style.display='none'; return; }
  m.innerHTML = t; m.style.display='block';
}

/* ---------- cálculo ---------- */
function coords(txt){
  var m = String(txt).replace('geo:','').match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
  return m ? {lat:parseFloat(m[1]), lng:parseFloat(m[2])} : null;
}
function dist(a,b){
  var R=6371, r=Math.PI/180;
  var dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
  var s = Math.pow(Math.sin(dLat/2),2) +
          Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.pow(Math.sin(dLng/2),2);
  return 2*R*Math.asin(Math.sqrt(s));
}

/* ---------- procurar endereço no mapa ---------- */
function buscarCoord(p){ fila.push(p); proximaBusca(); }
function proximaBusca(){
  if(buscando || fila.length === 0) return;
  buscando = true;
  var p = fila.shift();
  var x = new XMLHttpRequest();
  x.open('GET','https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(p.texto), true);
  x.onreadystatechange = function(){
    if(x.readyState !== 4) return;
    try{
      var r = JSON.parse(x.responseText);
      if(r && r[0]){ p.lat=parseFloat(r[0].lat); p.lng=parseFloat(r[0].lon); p.status='ok'; }
      else { p.status='nao_achou'; }
    }catch(e){ p.status='erro'; }
    salvar(); desenhar();
    setTimeout(function(){ buscando=false; proximaBusca(); }, 1200);
  };
  x.send();
}

/* ---------- adicionar ---------- */
function adicionar(txt){
  if(!txt) return;
  txt = txt.replace(/^\s+|\s+$/g,'');
  if(txt === '') return;
  var c = coords(txt);
  if(modo === 'coordenadas' && !c){
    msg('Nesse modo escreva dois números com vírgula: <b>-21.1704,-47.8103</b>. Para o nome da rua use a aba <b>Por endereço</b>.');
    return;
  }
  sequenciaPronta = false;
  paradas.push({ texto:txt, lat:c?c.lat:null, lng:c?c.lng:null,
                 feita:false, ir:true, km:null, status:c?'ok':'buscando' });
  if(!c) buscarCoord(paradas[paradas.length-1]);
  msg(''); salvar(); desenhar();
}

/* ---------- histórico de viagens finalizadas ---------- */
var viagens = [];          /* cada viagem fechada */
var viagemInicio = null;   /* quando a viagem atual começou */
var viagemKmReta = 0;      /* km em linha reta já percorridos nesta viagem */
var viagemEntregas = 0;

try{
  var vg = JSON.parse(localStorage.getItem('viagens'));
  if(vg){ viagens = vg.lista || []; viagemInicio = vg.inicio || null;
          viagemKmReta = vg.km || 0; viagemEntregas = vg.entregas || 0; }
}catch(e){}

function salvarViagens(){
  try{ localStorage.setItem('viagens', JSON.stringify(
    {lista:viagens, inicio:viagemInicio, km:viagemKmReta, entregas:viagemEntregas})); }catch(e){}
}

function finalizarViagem(){
  if(viagemEntregas === 0){
    alert('Nenhuma entrega feita nesta viagem ainda.');
    return;
  }
  var minutos = viagemInicio ? (Date.now() - viagemInicio)/60000 : 0;
  viagens.push({
    data: Date.now(),
    entregas: viagemEntregas,
    km: viagemKmReta * (1 + ajustes.estrada/100),
    minutos: minutos
  });
  /* tira da lista o que já foi entregue */
  var restam = [], i;
  for(i=0;i<paradas.length;i++){ if(!paradas[i].feita) restam.push(paradas[i]); }
  paradas = restam;
  viagemInicio = null; viagemKmReta = 0; viagemEntregas = 0;
  medida = null; kmRota = 0;
  salvarViagens(); salvar();
  irParaTela(3);
}

function totaisViagens(){
  var t = {n:viagens.length, entregas:0, km:0, minutos:0}, i;
  for(i=0;i<viagens.length;i++){
    t.entregas += viagens[i].entregas;
    t.km += viagens[i].km;
    t.minutos += viagens[i].minutos;
  }
  return t;
}

function dataTexto(ms){
  var d = new Date(ms);
  var p2 = function(x){ return (x<10?'0':'') + x; };
  return p2(d.getDate()) + '/' + p2(d.getMonth()+1) + '/' + d.getFullYear() +
         ' às ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}

/* ---------- histórico do seu tempo real por entrega ---------- */
var historico = [];      /* minutos de cada entrega, só o tempo parado */
var horaAnterior = null; /* quando você saiu da parada anterior */
var mediaManual = false; /* virou true se você digitar o valor na mão */

try{
  var hg = JSON.parse(localStorage.getItem('historico_entregas'));
  if(hg){ historico = hg.lista || []; horaAnterior = hg.hora || null; mediaManual = !!hg.manual; }
}catch(e){}

function salvarHistorico(){
  try{ localStorage.setItem('historico_entregas',
    JSON.stringify({lista:historico, hora:horaAnterior, manual:mediaManual})); }catch(e){}
}

/* mediana: um atraso enorme num dia não estraga a média */
function mediana(lista){
  if(lista.length === 0) return null;
  var a = lista.slice().sort(function(x,y){ return x-y; });
  var m = Math.floor(a.length/2);
  return (a.length % 2) ? a[m] : (a[m-1] + a[m]) / 2;
}

/* quanto tempo você levou dirigindo até essa parada, para descontar */
function minutosDeViagem(p){
  if(p.km == null) return 0;
  var kmEstrada = p.km * (1 + ajustes.estrada/100);
  return (ajustes.vel > 0) ? (kmEstrada / ajustes.vel) * 60 : 0;
}

/* chamado a cada Entreguei */
function registrarTempo(p){
  var agora = Date.now();
  if(horaAnterior){
    var intervalo = (agora - horaAnterior) / 60000;
    var servico = intervalo - minutosDeViagem(p);
    /* descarta o que claramente não é entrega: almoço, pausa, erro de toque */
    if(servico >= 0.3 && servico <= 90 && intervalo <= 240){
      historico.push(Math.round(servico*10)/10);
      if(historico.length > 200) historico = historico.slice(historico.length-200);
    }
  }
  horaAnterior = agora;
  if(!mediaManual && historico.length >= 3){
    var md = mediana(historico);
    ajustes.minEntrega = Math.round(md*10)/10;
    salvarAjustes();
  }
  salvarHistorico();
}

/* ---------- medição real pelas estradas (OSRM) ---------- */
var usarEstrada = true;   /* sempre tenta medir na estrada; se falhar, usa o que aprendeu */
var aprendizado = { fatores:[], velocidades:[] };
try{
  var ap = JSON.parse(localStorage.getItem('aprendizado'));
  if(ap){ aprendizado.fatores = ap.fatores || []; aprendizado.velocidades = ap.velocidades || []; }
}catch(e){}
function salvarAprendizado(){
  try{ localStorage.setItem('aprendizado', JSON.stringify(aprendizado)); }catch(e){}
}
var medida = null;        /* {km, min, n} vindo do mapa real */
var medindo = false;
var ultimoPonto = null;   /* de onde a rota foi calculada */

function medirEstrada(){
  if(!usarEstrada || medindo) return;
  var pts = [], i;
  for(i=0;i<paradas.length;i++){
    var p = paradas[i];
    if(p.ir && !p.feita && p.lat != null) pts.push(p);
  }
  if(pts.length === 0 || !ultimoPonto) return;
  if(pts.length > 24) pts = pts.slice(0,24);   /* limite do serviço público */

  var coords = ultimoPonto.lng + ',' + ultimoPonto.lat;
  for(i=0;i<pts.length;i++) coords += ';' + pts[i].lng + ',' + pts[i].lat;
  var fx = fim();
  if(fx) coords += ';' + fx.lng + ',' + fx.lat;

  medindo = true;
  desenhar();
  var x = new XMLHttpRequest();
  x.open('GET','https://router.project-osrm.org/route/v1/driving/' + coords + '?overview=false', true);
  x.timeout = 20000;
  x.onreadystatechange = function(){
    if(x.readyState !== 4) return;
    medindo = false;
    try{
      var r = JSON.parse(x.responseText);
      if(r && r.routes && r.routes[0]){
        medida = { km: r.routes[0].distance/1000,
                   min: r.routes[0].duration/60,
                   n: pts.length };
        aprenderComEstrada(medida, pts);
      } else { medida = null; }
    }catch(e){ medida = null; }
    desenhar();
  };
  x.ontimeout = x.onerror = function(){ medindo = false; medida = null; desenhar(); };
  x.send();
}

/* aprende sozinho: quanto a estrada é mais longa que a linha reta, e a que velocidade se roda */
function aprenderComEstrada(m, pts){
  var kmReta = custoTotal(ultimoPonto, pts);
  if(kmReta > 1){
    var f = m.km / kmReta;
    if(f > 1 && f < 2.5){
      aprendizado.fatores.push(f);
      if(aprendizado.fatores.length > 60) aprendizado.fatores.shift();
    }
  }
  if(m.min > 1){
    var v = m.km / (m.min/60);
    if(v > 15 && v < 110){
      aprendizado.velocidades.push(v);
      if(aprendizado.velocidades.length > 60) aprendizado.velocidades.shift();
    }
  }
  var mf = mediana(aprendizado.fatores), mv = mediana(aprendizado.velocidades);
  if(mf) ajustes.estrada = Math.round((mf-1)*100);
  if(mv) ajustes.vel = Math.round(mv);
  salvarAjustes(); salvarAprendizado();
}

/* ---------- previsão de tempo e distância ---------- */
var ajustes = { vel:40, minEntrega:8, estrada:30 };
try{
  var g = JSON.parse(localStorage.getItem('ajustes_rota'));
  if(g){ ajustes.vel = g.vel || 40; ajustes.minEntrega = g.minEntrega || 8; ajustes.estrada = (g.estrada != null ? g.estrada : 30); }
}catch(e){}
var ajustesAbertos = false;

function salvarAjustes(){ try{ localStorage.setItem('ajustes_rota', JSON.stringify(ajustes)); }catch(e){} }

function horaTexto(minutos){
  var h = Math.floor(minutos/60), m = Math.round(minutos%60);
  if(h === 0) return m + ' min';
  return h + 'h' + (m < 10 ? '0' : '') + m;
}

/* transforma km em linha reta + nº de paradas em tempo total */
function calcularPrevisao(kmReta, paradasQtd){
  var kmEstrada = kmReta * (1 + ajustes.estrada/100);
  var minDirigindo = (ajustes.vel > 0) ? (kmEstrada / ajustes.vel) * 60 : 0;
  var minParado = paradasQtd * ajustes.minEntrega;
  return { km:kmEstrada, dirigindo:minDirigindo, parado:minParado, total:minDirigindo + minParado };
}

function montarPrevisao(elId, kmReta, qtd, titulo){
  var el = document.getElementById(elId);
  if(!el) return;
  if(qtd === 0){ el.innerHTML = ''; return; }

  var real = (medida && medida.n === qtd);
  var c;
  if(real){
    c = { km: medida.km, dirigindo: medida.min, parado: qtd * ajustes.minEntrega,
          total: medida.min + qtd * ajustes.minEntrega };
  } else {
    c = calcularPrevisao(kmReta, qtd);
  }

  var f = new Date(Date.now() + c.total*60000);
  var hh = (f.getHours()<10?'0':'') + f.getHours() + ':' + (f.getMinutes()<10?'0':'') + f.getMinutes();

  var origemTempo = (historico.length >= 3)
    ? 'sua média de ' + historico.length + ' entregas'
    : 'estimativa inicial, o app ainda está aprendendo a sua';

  el.innerHTML =
    '<div class="prev">' +
      '<div class="rot">' + titulo + '</div>' +
      '<div class="grade">' +
        '<div class="cel"><div class="v">' + c.km.toFixed(0) + '</div><div class="r">km por estrada</div></div>' +
        '<div class="cel"><div class="v">' + horaTexto(c.total) + '</div><div class="r">tempo total</div></div>' +
        '<div class="cel"><div class="v">' + qtd + '</div><div class="r">entregas</div></div>' +
      '</div>' +
      '<div class="quebra">' +
        (medindo ? 'Consultando as estradas...' :
          (real ? horaTexto(c.dirigindo) + ' dirigindo, medido nas estradas reais'
                : horaTexto(c.dirigindo) + ' dirigindo a ' + ajustes.vel + ' km/h, sem sinal para medir')) +
        ' · ' + horaTexto(c.parado) + ' parado<br>' +
        ajustes.minEntrega + ' min por entrega (' + origemTempo + ')<br>' +
        'Termina por volta das <b>' + hh + '</b>' +
      '</div>' +
    '</div>';
}

/* ---------- link de navegação ---------- */
var autoMapa = true;
try{ autoMapa = localStorage.getItem('auto_mapa') !== 'nao'; }catch(e){}

function urlMapa(destino, origem){
  var u = 'https://www.google.com/maps/dir/?api=1&travelmode=driving' +
          '&destination=' + destino.lat + ',' + destino.lng;
  if(origem) u += '&origin=' + origem.lat + ',' + origem.lng;

/* ---------- otimizador de rota ---------- */

/* quanto roda no total: da minha posição até a 1ª, e de cada uma até a seguinte */
function fim(){ return (destinoFinal && destinoFinal.lat != null) ? destinoFinal : null; }

function custoTotal(ponto, arr){
  if(arr.length === 0) return 0;
  var soma = dist(ponto, arr[0]), i;
  for(i=0;i<arr.length-1;i++) soma += dist(arr[i], arr[i+1]);
  var f = fim();
  if(f) soma += dist(arr[arr.length-1], f);   /* último trecho: até em casa */
  return soma;
}

/* primeira versão da rota: sempre a mais perto de onde parei */
function rotaInicial(ponto, itens){
  var livres = itens.slice(), ordem = [], atual = ponto, i;
  while(livres.length){
    var melhor = 0, menor = 1e9;
    for(i=0;i<livres.length;i++){
      var d = dist(atual, livres[i]);
      if(d < menor){ menor = d; melhor = i; }
    }
    atual = livres.splice(melhor,1)[0];
    ordem.push(atual);
  }
  return ordem;
}

/* 2-opt: inverte trechos para desfazer cruzamentos e idas-e-voltas */
function doisOpt(ponto, arr){
  var n = arr.length, melhorou = true, giro = 0;
  while(melhorou && giro < 100){
    melhorou = false; giro++;
    for(var i=0;i<n-1;i++){
      var ant = (i === 0) ? ponto : arr[i-1];
      for(var j=i+1;j<n;j++){
        var seg = (j+1 < n) ? arr[j+1] : fim();
        var antes = dist(ant, arr[i]) + (seg ? dist(arr[j], seg) : 0);
        var depois = dist(ant, arr[j]) + (seg ? dist(arr[i], seg) : 0);
        if(depois < antes - 0.0001){
          var a = i, b = j, tmp;
          while(a < b){ tmp = arr[a]; arr[a] = arr[b]; arr[b] = tmp; a++; b--; }
          melhorou = true;
        }
      }
    }
  }
  return arr;
}

/* Or-opt: tira 1 a 3 paradas seguidas e encaixa no melhor lugar da rota */
function orOpt(ponto, arr){
  var melhorou = true, giro = 0;
  while(melhorou && giro < 60){
    melhorou = false; giro++;
    for(var t=1;t<=3;t++){
      for(var i=0;i+t<=arr.length;i++){
        var b = arr[i], e = arr[i+t-1];
        var a = (i === 0) ? ponto : arr[i-1];
        var f = (i+t < arr.length) ? arr[i+t] : fim();
        var ganho = dist(a,b) + (f ? dist(e,f) : 0) - (f ? dist(a,f) : 0);
        if(ganho <= 0.0001) continue;

        var sem = arr.slice(0,i).concat(arr.slice(i+t));
        var pedaco = arr.slice(i, i+t);
        var achou = -1, invertido = false, menorCusto = ganho - 0.0001;

        for(var j=0;j<=sem.length;j++){
          var c = (j === 0) ? ponto : sem[j-1];
          var d2 = (j < sem.length) ? sem[j] : fim();
          var base = (d2 ? dist(c,d2) : 0);
          var reto = dist(c,b) + (d2 ? dist(e,d2) : 0) - base;
          var virado = dist(c,e) + (d2 ? dist(b,d2) : 0) - base;
          if(reto < menorCusto){ menorCusto = reto; achou = j; invertido = false; }
          if(virado < menorCusto){ menorCusto = virado; achou = j; invertido = true; }
        }
        if(achou > -1){
          if(invertido) pedaco.reverse();
          arr = sem.slice(0,achou).concat(pedaco, sem.slice(achou));
          melhorou = true;
        }
      }
    }
  }
  return arr;
}

function otimizar(ponto, itens){
  if(itens.length <= 2) return rotaInicial(ponto, itens);
  var arr = rotaInicial(ponto, itens);
  arr = doisOpt(ponto, arr);
  arr = orOpt(ponto, arr);
  arr = doisOpt(ponto, arr);
  return arr;
}

/* ---------- ordenar a partir de um ponto ---------- */
var kmRota = 0;
function ordenarDe(ponto){
  var marcadas = [], resto = [], i;
  for(i=0;i<paradas.length;i++){
    var p = paradas[i];
    if(p.ir && !p.feita && p.lat != null) marcadas.push(p); else resto.push(p);
  }
  var ordem = otimizar(ponto, marcadas);
  var atual = ponto;
  for(i=0;i<ordem.length;i++){
    ordem[i].km = dist(atual, ordem[i]);
    atual = ordem[i];
  }
  kmRota = custoTotal(ponto, ordem);
  ultimoPonto = ponto;
  medida = null;              /* a rota mudou, a medição antiga não vale mais */
  paradas = ordem.concat(resto);
  salvar();
  if(usarEstrada) setTimeout(medirEstrada, 50);
}

/* ---------- iniciar / refazer a rota pelo GPS ---------- */
function comGps(depois){
  if(!navigator.geolocation){ msg('Este navegador não tem GPS.'); return; }
  navigator.geolocation.getCurrentPosition(
    function(pos){ depois({lat:pos.coords.latitude, lng:pos.coords.longitude}); },
    function(err){
      irParaTela(1);
      msg('GPS não liberado (' + err.message + '). Autorize a localização do site e tente de novo.');
    },
    {enableHighAccuracy:true, timeout:15000}
  );
}
function iniciarRota(){
  var tem = false, i;
  for(i=0;i<paradas.length;i++){
    if(paradas[i].ir && !paradas[i].feita && paradas[i].lat != null){ tem = true; break; }
  }
  if(!tem){ msg('Nenhuma entrega marcada com localização. Marque em <b>Ir</b> e confira se o endereço foi encontrado.'); return; }

  /* a aba precisa ser aberta agora, no toque; o GPS demora e o navegador bloquearia depois */
  var janela = autoMapa ? window.open('', '_blank') : null;

  comGps(function(pos){
    ordenarDe(pos);
    horaAnterior = Date.now();   /* começa a cronometrar a partir daqui */
    if(!viagemInicio){ viagemInicio = Date.now(); viagemKmReta = 0; viagemEntregas = 0; }
    salvarHistorico(); salvarViagens();
    irParaTela(2);
    var p0 = primeiraDaFila();
    if(janela && p0){ janela.location.href = urlMapa(p0, pos); }
    else if(autoMapa && p0){
      msg('O navegador bloqueou a abertura do mapa. Toque em <b>Ver no mapa</b> no cartão, ou libere pop-ups para este site.');
    }
  });
}

/* ---------- trocar de tela ---------- */
function irParaTela(n){
  document.getElementById('tela1').style.display = n === 1 ? 'block' : 'none';
  document.getElementById('tela2').style.display = n === 2 ? 'block' : 'none';
  document.getElementById('tela3').style.display = n === 3 ? 'block' : 'none';
  window.scrollTo(0,0);
  desenhar();
}

/* ---------- entregar: reordena a partir do ponto entregue ---------- */
function primeiraDaFila(){
  for(var i=0;i<paradas.length;i++){
    var p = paradas[i];
    if(p.ir && !p.feita && p.lat != null) return p;
  }
  return null;
}

function entregar(p){
  registrarTempo(p);
  viagemKmReta += (p.km || 0);
  viagemEntregas++;
  salvarViagens();
  var deOnde = (p.lat != null) ? {lat:p.lat, lng:p.lng} : null;
  p.feita = true;
  p.km = null;
  if(deOnde) ordenarDe(deOnde);
  salvar(); desenhar();
  window.scrollTo(0,0);

  /* já abre a navegação da próxima, aproveitando o toque do dedo */
  var prox = primeiraDaFila();
  if(autoMapa && prox) window.open(urlMapa(prox, deOnde), '_blank');
}

/* ---------- desenhar ---------- */
function desenhar(){
  var total = paradas.length, feitas = 0, marcadas = 0, i;
  for(i=0;i<paradas.length;i++){
    if(paradas[i].feita) feitas++;
    else if(paradas[i].ir) marcadas++;
  }
  var txtNum = feitas + '<small>/' + total + '</small>';
  document.getElementById('num1').innerHTML = txtNum;
  document.getElementById('num2').innerHTML = txtNum;
  document.getElementById('leg1').innerHTML = total === 0
    ? 'nenhuma entrega cadastrada'
    : '<b>' + (total-feitas) + '</b> faltando · ' + marcadas + ' marcadas para ir';
  document.getElementById('leg2').innerHTML =
    '<b>' + marcadas + '</b> na fila · ' + feitas + ' entregues' +
    (kmRota > 0 ? ' · ' + kmRota.toFixed(0) + ' km de rota' : '');
  document.getElementById('btiniciar').textContent =
    'Iniciar rota' + (marcadas ? ' (' + marcadas + ')' : '');

  pintarAuto();
  desenharHistorico();
  desenharCasa();
  desenharCadastro();
  desenharRota();
  desenharPrevisoes();
}

/* bloco da cidade de término */
function desenharCasa(){
  var el = document.getElementById('casa');
  if(!el) return;
  if(destinoFinal){
    var sub = (destinoFinal.lat != null)
      ? 'a rota vai terminar aqui'
      : (destinoFinal.status === 'buscando' ? 'procurando no mapa...' : 'não encontrado — toque em Trocar');
    el.innerHTML =
      '<div class="casa"><div class="rot">Terminar a rota em</div>' +
        '<div class="atual"><div class="nome"></div>' +
        '<button class="claro" id="btCasaTirar">Trocar</button></div></div>';
    el.querySelector('.nome').innerHTML = '<span></span><small>' + sub + '</small>';
    el.querySelector('.nome span').textContent = destinoFinal.texto;
    document.getElementById('btCasaTirar').onclick = function(){
      destinoFinal = null; salvar(); desenhar();
    };
  } else {
    el.innerHTML =
      '<div class="casa"><div class="rot">Terminar a rota em</div>' +
        '<div class="campo" style="margin-bottom:6px">' +
          '<input id="cxCasa" placeholder="Cidade ou endereço onde você mora">' +
          '<button id="btCasa">Definir</button>' +
        '</div>' +
        '<div class="quebra" style="font-size:12px;color:var(--fraco)">' +
          'As últimas entregas da sequência vão ficar do lado de casa.</div>' +
      '</div>';
    document.getElementById('btCasa').onclick = function(){
      var v = document.getElementById('cxCasa').value.replace(/^\s+|\s+$/g,'');
      if(v === '') return;
      var c = coords(v);
      destinoFinal = { texto:v, lat:c?c.lat:null, lng:c?c.lng:null, status:c?'ok':'buscando' };
      if(!c) buscarCoord(destinoFinal);
      salvar(); desenhar();
    };
  }
}

/* previsão da tela 1 (antes de iniciar) e da tela 2 (o que falta) */
function desenharPrevisoes(){
  var marcadas = [], i;
  for(i=0;i<paradas.length;i++){
    var p = paradas[i];
    if(p.ir && !p.feita && p.lat != null) marcadas.push(p);
  }
  if(marcadas.length === 0){
    document.getElementById('prev1').innerHTML = '';
    document.getElementById('prev2').innerHTML = '';
    return;
  }
  /* tela 1: ainda não sei onde você está, então estimo saindo da 1ª entrega */
  var ordem = otimizar(marcadas[0], marcadas);
  montarPrevisao('prev1', custoTotal(marcadas[0], ordem), marcadas.length, 'Previsão desta rota');

  /* tela 2: usa a rota real já calculada a partir do seu GPS */
  montarPrevisao('prev2', kmRota > 0 ? kmRota : custoTotal(marcadas[0], ordem), marcadas.length, 'Falta rodar');
}

function desenharCadastro(){
  var ul = document.getElementById('lista1');
  ul.innerHTML = '';
  var i, ordemN = 0;
  for(i=0;i<paradas.length;i++){
    (function(p){
      var li = document.createElement('li');
      if(p.feita) li.className = 'ok';
      else if(p.ir) li.className = 'sel';

      var pos = document.createElement('div');
      pos.className = 'pos';
      if(p.feita) pos.innerHTML = '&#10003;';
      else if(!p.ir) pos.innerHTML = '&mdash;';
      else if(sequenciaPronta){ ordemN++; pos.innerHTML = ordemN + '&ordf;'; }
      else pos.innerHTML = '&#9679;';

      var box = document.createElement('div');
      box.className = 'txt';
      var t = document.createElement('div'); t.textContent = p.texto;
      var s = document.createElement('div'); s.className = 'sub';

      else if(!p.ir) s.textContent = 'fora desta rota';
      else if(sequenciaPronta && p.km != null)
        s.textContent = (ordemN === 1 ? p.km.toFixed(1) + ' km de onde você está'
                                      : p.km.toFixed(1) + ' km da anterior');
      else if(p.lat != null) s.textContent = 'localizada, pronta para a rota';
      else if(p.status === 'buscando') s.textContent = 'procurando no mapa...';
      else s.textContent = 'endereço não encontrado — toque em Buscar';
      box.appendChild(t); box.appendChild(s);

      var bt = document.createElement('div'); bt.className = 'bt';

      if(!p.feita){
        var bIr = document.createElement('button');
        bIr.className = p.ir ? 'ir on' : 'ir';
        bIr.textContent = 'Ir';
        bIr.onclick = function(){ p.ir = !p.ir; p.km = null; sequenciaPronta = false; salvar(); desenhar(); };
        bt.appendChild(bIr);
      }
      if(!p.feita && p.lat == null && p.status !== 'buscando'){
        var b3 = document.createElement('button');
        b3.className = 'claro'; b3.textContent = 'Buscar';
        b3.onclick = function(){ p.status='buscando'; desenhar(); buscarCoord(p); };
        bt.appendChild(b3);
      }
      if(p.feita){
        var b4 = document.createElement('button');
        b4.className = 'claro'; b4.textContent = 'Desfazer';
        b4.onclick = function(){ p.feita = false; salvar(); desenhar(); };
        bt.appendChild(b4);
      }
      var b2 = document.createElement('button');
      b2.className = 'claro'; b2.textContent = 'Tirar';
      b2.onclick = function(){
        var k = paradas.indexOf(p); if(k > -1) paradas.splice(k,1);
        salvar(); desenhar();
      };
      bt.appendChild(b2);

      li.appendChild(pos); li.appendChild(box); li.appendChild(bt);
      ul.appendChild(li);
    })(paradas[i]);
  }
}

function desenharRota(){
  var fila2 = [], i;
  for(i=0;i<paradas.length;i++){
    var p = paradas[i];
    if(p.ir && !p.feita && p.lat != null) fila2.push(p);

  if(fila2.length === 0){

    f.textContent = 'Rota concluída. Todas as entregas marcadas foram feitas.';
    bloco.appendChild(f);
    var bf = document.createElement('button');
    bf.style.width = '100%'; bf.style.marginTop = '12px';
    bf.textContent = 'FINALIZAR VIAGEM E SALVAR NO HISTÓRICO';

  /* cartão da próxima entrega */

  var c = document.createElement('div'); c.className = 'proxima';
  var r = document.createElement('div'); r.className = 'rot'; r.textContent = 'Próxima entrega';
  var e = document.createElement('div'); e.className = 'end'; e.textContent = p0.texto;
  var k = document.createElement('div'); k.className = 'km';
  k.textContent = (p0.km != null ? p0.km.toFixed(1) + ' km daqui · ' : '') + 'faltam ' + fila2.length;
  var ac = document.createElement('div'); ac.className = 'acoes';
  var a = document.createElement('a');
  a.href = 'https://www.google.com/maps/dir/?api=1&destination=' + p0.lat + ',' + p0.lng;
  a.target = '_blank'; a.textContent = 'Ver no mapa';
  var b = document.createElement('button');
  b.className = 'verde'; b.textContent = 'Entreguei';
  b.onclick = function(){ entregar(p0); };
  ac.appendChild(a); ac.appendChild(b);
  c.appendChild(r); c.appendChild(e); c.appendChild(k); c.appendChild(ac);
  bloco.appendChild(c);

  /* as próximas da sequência */
  var marcaFim = fim();
  for(i=1;i<fila2.length;i++){
    (function(p,n){
      var li = document.createElement('li');
      var pos = document.createElement('div'); pos.className = 'pos';
      pos.innerHTML = n + '&ordf;';
      var box = document.createElement('div'); box.className = 'txt';
      var t = document.createElement('div'); t.textContent = p.texto;
      var s = document.createElement('div'); s.className = 'sub';
      s.textContent = (p.km != null ? p.km.toFixed(1) + ' km da anterior' : '');
      box.appendChild(t); box.appendChild(s);
      var bt = document.createElement('div'); bt.className = 'bt';
      var am = document.createElement('a');
      am.className = 'mapa'; am.target = '_blank'; am.textContent = 'Mapa';
      am.href = 'https://www.google.com/maps/dir/?api=1&destination=' + p.lat + ',' + p.lng;
      bt.appendChild(am);
      li.appendChild(pos); li.appendChild(box); li.appendChild(bt);
      ul.appendChild(li);
    })(fila2[i], i+1);
  }

  /* encerrar antes de terminar tudo */
  var be = document.createElement('button');
  be.className = 'pill'; be.style.marginTop = '14px';
  be.textContent = 'ENCERRAR VIAGEM AGORA (' + viagemEntregas + ' ENTREGUES)';
  be.onclick = function(){
    if(confirm('Encerrar a viagem e salvar no histórico? As entregas não feitas continuam na lista.')) finalizarViagem();
  };

  /* linha final: chegada em casa */
  if(marcaFim){
    var ult = fila2[fila2.length-1];
    var lf = document.createElement('li');
    lf.style.borderColor = 'var(--acento)';
    lf.style.opacity = '.85';
    var pf = document.createElement('div'); pf.className='pos';
    pf.innerHTML = '&#8962;';
    pf.style.color = 'var(--acento)';
    var bf = document.createElement('div'); bf.className='txt';
    var tf = document.createElement('div'); tf.textContent = destinoFinal.texto;
    var sf = document.createElement('div'); sf.className='sub';
    sf.textContent = 'fim da rota · ' + dist(ult, marcaFim).toFixed(1) + ' km da última entrega';
    bf.appendChild(tf); bf.appendChild(sf);
    lf.appendChild(pf); lf.appendChild(bf);
    ul.appendChild(lf);
  }
  ul.parentNode.appendChild(be);
}

/* ---------- modos ---------- */
function trocarModo(m){
  modo = m;
  var e = document.getElementById('abaEnd'), c = document.getElementById('abaCoo');
  var cx = document.getElementById('cx'), dica = document.getElementById('dica');
  if(m === 'endereco'){
    e.className='aba on'; c.className='aba';
    cx.placeholder = 'Rua, número, bairro, cidade';
    dica.textContent = 'Digite o endereço completo com a cidade. O app procura no mapa sozinho.';
  } else {
    e.className='aba'; c.className='aba on';
    cx.placeholder = '-21.1704,-47.8103';
    dica.textContent = 'Latitude e longitude separadas por vírgula. Entra na hora, sem depender de internet.';
  }
  msg('');
}

/* ---------- botões ---------- */
document.getElementById('abaEnd').onclick = function(){ trocarModo('endereco'); };
document.getElementById('abaCoo').onclick = function(){ trocarModo('coordenadas'); };
document.getElementById('add').onclick = function(){
  var cx = document.getElementById('cx');
  adicionar(cx.value); cx.value = ''; cx.blur();
};
document.getElementById('cx').onkeydown = function(e){
  if(e.keyCode === 13) document.getElementById('add').onclick();
};
document.getElementById('btatualizar').onclick = function(){
  var tem = false, i;
  for(i=0;i<paradas.length;i++){
    if(paradas[i].ir && !paradas[i].feita && paradas[i].lat != null){ tem = true; break; }
  }
  if(!tem){ msg('Nenhuma entrega marcada com localização para ordenar.'); return; }
  msg('Buscando sua posição para montar a sequência...');
  comGps(function(pos){
    ordenarDe(pos);
    sequenciaPronta = true;
    msg('');
    desenhar();
    window.scrollTo(0,0);
  });
};
document.getElementById('btiniciar').onclick = iniciarRota;
function pintarAuto(){
  var b = document.getElementById('btauto');
  b.className = autoMapa ? 'pill on' : 'pill';
  b.textContent = autoMapa ? 'MAPA ABRE SOZINHO: LIGADO' : 'MAPA ABRE SOZINHO: DESLIGADO';
}
document.getElementById('btauto').onclick = function(){
  autoMapa = !autoMapa;
  try{ localStorage.setItem('auto_mapa', autoMapa ? 'sim' : 'nao'); }catch(e){}
  pintarAuto();
};
document.getElementById('btvoltar').onclick = function(){ irParaTela(1); };
document.getElementById('btHist').onclick = function(){ irParaTela(3); };
document.getElementById('btvoltar3').onclick = function(){ irParaTela(1); };
document.getElementById('btlimpahist').onclick = function(){
  if(confirm('Apagar todo o histórico de viagens? Isso não apaga o aprendizado do tempo por entrega.')){
    viagens = []; salvarViagens(); desenhar();
  }
};
document.getElementById('btrefazer').onclick = function(){
  comGps(function(pos){ ordenarDe(pos); desenhar(); window.scrollTo(0,0); });
};
document.getElementById('btlimpa').onclick = function(){
  if(confirm('Apagar todas as entregas?')){ paradas = []; msg(''); salvar(); desenhar(); }
};

/* ---------- claro / escuro ---------- */
function aplicarTema(t){
  document.body.className = (t === 'claro') ? 'claro' : '';
  document.getElementById('tema').innerHTML = (t === 'claro') ? '&#9789;' : '&#9728;';
  try{ localStorage.setItem('tema_rota', t); }catch(e){}
}
document.getElementById('tema').onclick = function(){
  aplicarTema(document.body.className === 'claro' ? 'escuro' : 'claro');
};
var temaSalvo = 'escuro';
try{ temaSalvo = localStorage.getItem('tema_rota') || 'escuro'; }catch(e){}
aplicarTema(temaSalvo);

carregar();
desenhar();
</script>
