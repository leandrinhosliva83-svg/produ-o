<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rota de Entregas</title>
<style>
body{margin:0;padding:0 0 96px;background:#F1F3F0;color:#141A17;
  font-family:-apple-system,Roboto,Arial,sans-serif;font-size:16px}
header{background:#fff;padding:16px;border-bottom:1px solid #DDE2DE;position:sticky;top:0;z-index:5}
h1{font-size:13px;margin:0 0 8px;color:#5B6862;text-transform:uppercase;letter-spacing:.1em}
.num{font-size:42px;font-weight:bold;line-height:1}
.num small{font-size:19px;color:#9AA5A0}
.leg{font-size:13px;color:#5B6862;margin-top:4px}
main{padding:14px}
button{font-family:inherit;font-size:15px;border-radius:8px;border:1px solid #141A17;
  background:#141A17;color:#fff;padding:13px 14px;cursor:pointer}
button.claro{background:#fff;color:#141A17;border-color:#DDE2DE;padding:9px 10px;font-size:13px}
button.verde{background:#0B7A4B;border-color:#0B7A4B;color:#fff}
button.ir{background:#fff;color:#1B4DE4;border-color:#C3D0F8;padding:9px 14px;font-size:13px;font-weight:bold}
button.ir.on{background:#0B7A4B;border-color:#0B7A4B;color:#fff}
.abas{display:flex;margin-bottom:10px;border:1px solid #DDE2DE;border-radius:8px;overflow:hidden;background:#fff}
.aba{flex:1;background:#fff;color:#5B6862;border:0;padding:11px 6px;font-size:14px}
.aba.on{background:#141A17;color:#fff;font-weight:bold}
.campo{display:flex;gap:8px;margin-bottom:6px}
.campo input{flex:1;min-width:0;padding:13px;font-size:16px;border:1px solid #DDE2DE;border-radius:8px;background:#fff}
.dica{font-size:12px;color:#5B6862;margin:0 0 16px}
ul{list-style:none;margin:0;padding:0}
li{background:#fff;border:1px solid #DDE2DE;border-radius:10px;padding:11px 12px;
  margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
li.sel{border-color:#0B7A4B}
li.ok{opacity:.5}
li.ok .txt div:first-child{text-decoration:line-through}
.pos{font-weight:bold;color:#5B6862;min-width:24px;padding-top:2px}
li.sel .pos{color:#0B7A4B}
.txt{flex:1;word-break:break-word}
.sub{font-size:12px;color:#5B6862;margin-top:3px}
.bt{display:flex;flex-direction:column;gap:5px}
a.mapa{font-size:13px;color:#1B4DE4;text-decoration:none;border:1px solid #C3D0F8;
  border-radius:8px;padding:9px 10px;text-align:center;display:block}
.rodape{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #DDE2DE;
  padding:10px;display:flex;gap:8px}
.rodape button{flex:1}
.msg{background:#FFF4E8;border:1px solid #F0D7BC;color:#B8541C;padding:10px;
  border-radius:8px;font-size:13px;margin-bottom:12px}
.rodapetxt{font-size:11px;color:#9AA5A0;text-align:center;margin-top:16px}

/* tela da rota */
.proxima{background:#fff;border:2px solid #0B7A4B;border-radius:12px;padding:16px;margin-bottom:8px}
.proxima .rot{font-size:12px;color:#0B7A4B;font-weight:bold;text-transform:uppercase;letter-spacing:.1em}
.proxima .end{font-size:22px;font-weight:bold;line-height:1.25;margin:8px 0 6px;word-break:break-word}
.proxima .km{font-size:14px;color:#5B6862;margin-bottom:14px}
.proxima .acoes{display:flex;gap:8px}
.proxima .acoes a,.proxima .acoes button{flex:1;padding:15px 8px;font-size:15px;text-align:center;
  border-radius:9px;text-decoration:none;display:block;font-weight:bold}
.proxima .acoes a{background:#1B4DE4;color:#fff;border:1px solid #1B4DE4}
.tit{font-size:12px;color:#5B6862;text-transform:uppercase;letter-spacing:.1em;margin:20px 0 8px}
.fim{background:#E8F3ED;border:1px solid #B7DCC9;color:#0B5F3B;padding:20px;border-radius:12px;
  text-align:center;font-size:17px;font-weight:bold}
</style>
</head>
<body>

<!-- ======== TELA 1: CADASTRO ======== -->
<div id="tela1">
  <header>
    <h1>Entregas cadastradas</h1>
    <div class="num" id="num1">0<small>/0</small></div>
    <div class="leg" id="leg1">nenhuma entrega cadastrada</div>
  </header>
  <main>
    <div class="msg" id="msg" style="display:none"></div>

    <div class="abas">
      <button id="abaEnd" class="aba on">Por endereço</button>
      <button id="abaCoo" class="aba">Por coordenadas</button>
    </div>
    <div class="campo">
      <input id="cx" placeholder="Rua, número, bairro, cidade">
      <button id="add">Adicionar</button>
    </div>
    <p class="dica" id="dica">Digite o endereço completo com a cidade. O app procura no mapa sozinho.</p>

    <ul id="lista1"></ul>
    <p class="rodapetxt">versão 5 · duas telas</p>
  </main>
  <div class="rodape">
    <button id="btiniciar">Iniciar rota</button>
    <button id="btlimpa" class="claro" style="flex:0 0 84px">Limpar</button>
  </div>
</div>

<!-- ======== TELA 2: ROTA ======== -->
<div id="tela2" style="display:none">
  <header>
    <h1>Rota em andamento</h1>
    <div class="num" id="num2">0<small>/0</small></div>
    <div class="leg" id="leg2"></div>
  </header>
  <main>
    <div id="blocoProxima"></div>
    <div class="tit" id="titDepois" style="display:none">Depois dessa</div>
    <ul id="lista2"></ul>
  </main>
  <div class="rodape">
    <button id="btvoltar" class="claro" style="padding:13px">Voltar ao cadastro</button>
    <button id="btrefazer">Refazer daqui</button>
  </div>
</div>

<script>
var paradas = [];
var modo = 'endereco';
var fila = [], buscando = false;

/* ---------- guardar ---------- */
function salvar(){ try{ localStorage.setItem('rota_v5', JSON.stringify(paradas)); }catch(e){} }
function carregar(){
  try{ var d = JSON.parse(localStorage.getItem('rota_v5')); if(d) paradas = d; }
  catch(e){ paradas = []; }
}
function msg(t){
  var m = document.getElementById('msg');
  if(!t){ m.style.display='none'; return; }
  m.innerHTML = t; m.style.display='block';
}

/* ---------- cálculo ---------- */
function coords(txt){
  var m = String(txt).replace('geo:','').match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
  return m ? {lat:parseFloat(m[1]), lng:parseFloat(m[2])} : null;
}
function dist(a,b){
  var R=6371, r=Math.PI/180;
  var dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
  var s = Math.pow(Math.sin(dLat/2),2) +
          Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.pow(Math.sin(dLng/2),2);
  return 2*R*Math.asin(Math.sqrt(s));
}

/* ---------- procurar endereço no mapa ---------- */
function buscarCoord(p){ fila.push(p); proximaBusca(); }
function proximaBusca(){
  if(buscando || fila.length === 0) return;
  buscando = true;
  var p = fila.shift();
  var x = new XMLHttpRequest();
  x.open('GET','https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(p.texto), true);
  x.onreadystatechange = function(){
    if(x.readyState !== 4) return;
    try{
      var r = JSON.parse(x.responseText);
      if(r && r[0]){ p.lat=parseFloat(r[0].lat); p.lng=parseFloat(r[0].lon); p.status='ok'; }
      else { p.status='nao_achou'; }
    }catch(e){ p.status='erro'; }
    salvar(); desenhar();
    setTimeout(function(){ buscando=false; proximaBusca(); }, 1200);
  };
  x.send();
}

/* ---------- adicionar ---------- */
function adicionar(txt){
  if(!txt) return;
  txt = txt.replace(/^\s+|\s+$/g,'');
  if(txt === '') return;
  var c = coords(txt);
  if(modo === 'coordenadas' && !c){
    msg('Nesse modo escreva dois números com vírgula: <b>-21.1704,-47.8103</b>. Para o nome da rua use a aba <b>Por endereço</b>.');
    return;
  }
  paradas.push({ texto:txt, lat:c?c.lat:null, lng:c?c.lng:null,
                 feita:false, ir:true, km:null, status:c?'ok':'buscando' });
  if(!c) buscarCoord(paradas[paradas.length-1]);
  msg(''); salvar(); desenhar();
}

/* ---------- ordenar a partir de um ponto ---------- */
function ordenarDe(ponto){
  var marcadas = [], resto = [], i;
  for(i=0;i<paradas.length;i++){
    var p = paradas[i];
    if(p.ir && !p.feita && p.lat != null) marcadas.push(p); else resto.push(p);
  }
  var ordem = [], atual = ponto;
  while(marcadas.length){
    var melhor = 0, menor = 1e9;
    for(i=0;i<marcadas.length;i++){
      var d = dist(atual, marcadas[i]);
      if(d < menor){ menor = d; melhor = i; }
    }
    var q = marcadas.splice(melhor,1)[0];
    q.km = menor;
    ordem.push(q);
    atual = q;
  }
  paradas = ordem.concat(resto);
  salvar();
}

/* ---------- iniciar / refazer a rota pelo GPS ---------- */
function comGps(depois){
  if(!navigator.geolocation){ msg('Este navegador não tem GPS.'); return; }
  navigator.geolocation.getCurrentPosition(
    function(pos){ depois({lat:pos.coords.latitude, lng:pos.coords.longitude}); },
    function(err){
      irParaTela(1);
      msg('GPS não liberado (' + err.message + '). Autorize a localização do site e tente de novo.');
    },
    {enableHighAccuracy:true, timeout:15000}
  );
}
function iniciarRota(){
  var tem = false, i;
  for(i=0;i<paradas.length;i++){
    if(paradas[i].ir && !paradas[i].feita && paradas[i].lat != null){ tem = true; break; }
  }
  if(!tem){ msg('Nenhuma entrega marcada com localização. Marque em <b>Ir</b> e confira se o endereço foi encontrado.'); return; }
  comGps(function(pos){ ordenarDe(pos); irParaTela(2); });
}

/* ---------- trocar de tela ---------- */
function irParaTela(n){
  document.getElementById('tela1').style.display = n === 1 ? 'block' : 'none';
  document.getElementById('tela2').style.display = n === 2 ? 'block' : 'none';
  window.scrollTo(0,0);
  desenhar();
}

/* ---------- entregar: reordena a partir do ponto entregue ---------- */
function entregar(p){
  p.feita = true;
  p.km = null;
  if(p.lat != null) ordenarDe({lat:p.lat, lng:p.lng});
  salvar(); desenhar();
  window.scrollTo(0,0);
}

/* ---------- desenhar ---------- */
function desenhar(){
  var total = paradas.length, feitas = 0, marcadas = 0, i;
  for(i=0;i<paradas.length;i++){
    if(paradas[i].feita) feitas++;
    else if(paradas[i].ir) marcadas++;
  }
  var txtNum = feitas + '<small>/' + total + '</small>';
  document.getElementById('num1').innerHTML = txtNum;
  document.getElementById('num2').innerHTML = txtNum;
  document.getElementById('leg1').innerHTML = total === 0
    ? 'nenhuma entrega cadastrada'
    : '<b>' + (total-feitas) + '</b> faltando · ' + marcadas + ' marcadas para ir';
  document.getElementById('leg2').innerHTML =
    '<b>' + marcadas + '</b> na fila · ' + feitas + ' entregues';
  document.getElementById('btiniciar').textContent =
    'Iniciar rota' + (marcadas ? ' (' + marcadas + ')' : '');

  desenharCadastro();
  desenharRota();
}

function desenharCadastro(){
  var ul = document.getElementById('lista1');
  ul.innerHTML = '';
  var i;
  for(i=0;i<paradas.length;i++){
    (function(p){
      var li = document.createElement('li');
      if(p.feita) li.className = 'ok';
      else if(p.ir) li.className = 'sel';

      var pos = document.createElement('div');
      pos.className = 'pos';
      pos.innerHTML = p.feita ? '&#10003;' : (p.ir ? '&#9679;' : '&mdash;');

      var box = document.createElement('div');
      box.className = 'txt';
      var t = document.createElement('div'); t.textContent = p.texto;
      var s = document.createElement('div'); s.className = 'sub';
      if(p.feita) s.textContent = 'entregue';
      else if(!p.ir) s.textContent = 'fora desta rota';
      else if(p.lat != null) s.textContent = 'localizada, pronta para a rota';
      else if(p.status === 'buscando') s.textContent = 'procurando no mapa...';
      else s.textContent = 'endereço não encontrado — toque em Buscar';
      box.appendChild(t); box.appendChild(s);

      var bt = document.createElement('div'); bt.className = 'bt';

      if(!p.feita){
        var bIr = document.createElement('button');
        bIr.className = p.ir ? 'ir on' : 'ir';
        bIr.textContent = 'Ir';
        bIr.onclick = function(){ p.ir = !p.ir; p.km = null; salvar(); desenhar(); };
        bt.appendChild(bIr);
      }
      if(!p.feita && p.lat == null && p.status !== 'buscando'){
        var b3 = document.createElement('button');
        b3.className = 'claro'; b3.textContent = 'Buscar';
        b3.onclick = function(){ p.status='buscando'; desenhar(); buscarCoord(p); };
        bt.appendChild(b3);
      }
      if(p.feita){
        var b4 = document.createElement('button');
        b4.className = 'claro'; b4.textContent = 'Desfazer';
        b4.onclick = function(){ p.feita = false; salvar(); desenhar(); };
        bt.appendChild(b4);
      }
      var b2 = document.createElement('button');
      b2.className = 'claro'; b2.textContent = 'Tirar';
      b2.onclick = function(){
        var k = paradas.indexOf(p); if(k > -1) paradas.splice(k,1);
        salvar(); desenhar();
      };
      bt.appendChild(b2);

      li.appendChild(pos); li.appendChild(box); li.appendChild(bt);
      ul.appendChild(li);
    })(paradas[i]);
  }
}

function desenharRota(){
  var fila2 = [], i;
  for(i=0;i<paradas.length;i++){
    var p = paradas[i];
    if(p.ir && !p.feita && p.lat != null) fila2.push(p);
  }
  var bloco = document.getElementById('blocoProxima');
  var ul = document.getElementById('lista2');
  bloco.innerHTML = ''; ul.innerHTML = '';
  document.getElementById('titDepois').style.display = fila2.length > 1 ? 'block' : 'none';

  if(fila2.length === 0){
    var f = document.createElement('div');
    f.className = 'fim';
    f.textContent = 'Rota concluída. Todas as entregas marcadas foram feitas.';
    bloco.appendChild(f);
    return;
  }

  /* cartão da próxima entrega */
  var p0 = fila2[0];
  var c = document.createElement('div'); c.className = 'proxima';
  var r = document.createElement('div'); r.className = 'rot'; r.textContent = 'Próxima entrega';
  var e = document.createElement('div'); e.className = 'end'; e.textContent = p0.texto;
  var k = document.createElement('div'); k.className = 'km';
  k.textContent = (p0.km != null ? p0.km.toFixed(1) + ' km daqui · ' : '') + 'faltam ' + fila2.length;
  var ac = document.createElement('div'); ac.className = 'acoes';
  var a = document.createElement('a');
  a.href = 'https://www.google.com/maps/dir/?api=1&destination=' + p0.lat + ',' + p0.lng;
  a.target = '_blank'; a.textContent = 'Ver no mapa';
  var b = document.createElement('button');
  b.className = 'verde'; b.textContent = 'Entreguei';
  b.onclick = function(){ entregar(p0); };
  ac.appendChild(a); ac.appendChild(b);
  c.appendChild(r); c.appendChild(e); c.appendChild(k); c.appendChild(ac);
  bloco.appendChild(c);

  /* as próximas da sequência */
  for(i=1;i<fila2.length;i++){
    (function(p,n){
      var li = document.createElement('li');
      var pos = document.createElement('div'); pos.className = 'pos';
      pos.innerHTML = n + '&ordf;';
      var box = document.createElement('div'); box.className = 'txt';
      var t = document.createElement('div'); t.textContent = p.texto;
      var s = document.createElement('div'); s.className = 'sub';
      s.textContent = (p.km != null ? p.km.toFixed(1) + ' km da anterior' : '');
      box.appendChild(t); box.appendChild(s);
      var bt = document.createElement('div'); bt.className = 'bt';
      var am = document.createElement('a');
      am.className = 'mapa'; am.target = '_blank'; am.textContent = 'Mapa';
      am.href = 'https://www.google.com/maps/dir/?api=1&destination=' + p.lat + ',' + p.lng;
      bt.appendChild(am);
      li.appendChild(pos); li.appendChild(box); li.appendChild(bt);
      ul.appendChild(li);
    })(fila2[i], i+1);
  }
}

/* ---------- modos ---------- */
function trocarModo(m){
  modo = m;
  var e = document.getElementById('abaEnd'), c = document.getElementById('abaCoo');
  var cx = document.getElementById('cx'), dica = document.getElementById('dica');
  if(m === 'endereco'){
    e.className='aba on'; c.className='aba';
    cx.placeholder = 'Rua, número, bairro, cidade';
    dica.textContent = 'Digite o endereço completo com a cidade. O app procura no mapa sozinho.';
  } else {
    e.className='aba'; c.className='aba on';
    cx.placeholder = '-21.1704,-47.8103';
    dica.textContent = 'Latitude e longitude separadas por vírgula. Entra na hora, sem depender de internet.';
  }
  msg('');
}

/* ---------- botões ---------- */
document.getElementById('abaEnd').onclick = function(){ trocarModo('endereco'); };
document.getElementById('abaCoo').onclick = function(){ trocarModo('coordenadas'); };
document.getElementById('add').onclick = function(){
  var cx = document.getElementById('cx');
  adicionar(cx.value); cx.value = ''; cx.blur();
};
document.getElementById('cx').onkeydown = function(e){
  if(e.keyCode === 13) document.getElementById('add').onclick();
};
document.getElementById('btiniciar').onclick = iniciarRota;
document.getElementById('btvoltar').onclick = function(){ irParaTela(1); };
document.getElementById('btrefazer').onclick = function(){
  comGps(function(pos){ ordenarDe(pos); desenhar(); window.scrollTo(0,0); });
};
document.getElementById('btlimpa').onclick = function(){
  if(confirm('Apagar todas as entregas?')){ paradas = []; msg(''); salvar(); desenhar(); }
};

carregar();
desenhar();
</script>
</body>
</html>
