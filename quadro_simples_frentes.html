<script>
const API='https://proxy-velocidade.leandrinhosliva83.workers.dev';
// Códigos secundários ficam internos e são consolidados na frente principal.
const MAPA_FRENTES={2:2,3:3,4:4,7:7,11:11,12:12,15:5,46:6,47:7,48:8,254:11,883:11};
let equipamentos=[];
let frentesEncontradas=[];
let token=localStorage.getItem('qf-token')||'';
let frenteAtual='';
let filtroOperacaoAtual='todas';
let filtroTipoAtual='todos';
let equipamentoDestacado='';

async function entrar(){
  const btn=document.getElementById('btn-entrar'),erro=document.getElementById('erro-login');
  erro.style.display='none';btn.disabled=true;btn.textContent='Entrando...';
  try{
    const r=await fetch(API+'/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('senha').value})});
    const data=await r.json();if(!data.token)throw new Error('E-mail ou senha incorretos.');
    token=data.token;localStorage.setItem('qf-token',token);abrirQuadro();
  }catch(e){erro.textContent=e.message||'Não foi possível entrar.';erro.style.display='block'}
  finally{btn.disabled=false;btn.textContent='Entrar e abrir frentes'}
}
function abrirQuadro(){document.getElementById('inicio').style.display='none';document.getElementById('app').style.display='block';carregar()}
function nomeFrente(v){if(!v||v==='-')return'Sem frente';const texto=String(v).trim();if(/PLANTIO MANUAL/i.test(texto))return'Plantio Manual';if(/FERTIRRIGAÇÃO CAMINHÃO/i.test(texto))return'Fertirrigação · Caminhão';if(/FERTIRRIGAÇÃO CANAL/i.test(texto))return'Fertirrigação · Canal';const m=texto.match(/FRENTE\s*(\d+)/i),n=m?+m[1]:parseInt(texto.replace(/\D/g,''));if(n===1)return'Frente 01 · Corte Manual';if(n===10)return'Frente 10 · Herbicida';if(n===11)return'Frente 11 · Preparo de Solo';if(n===12)return'Frente 12 · Apoio';return isNaN(n)?texto:'Frente '+String(n).padStart(2,'0')}
function numeroFrente(v){const m=String(v||'').match(/FRENTE\s*(\d+)/i);return m?+m[1]:999}
function compararGrupos(a,b){const na=numeroFrente(a),nb=numeroFrente(b);return na!==nb?na-nb:String(a).localeCompare(String(b),'pt-BR')}
function trajetoAtual(eq){const t=Array.isArray(eq.trajetos)?eq.trajetos:[];return t[0]||{}}
function dataLeitura(t){if(!t)return null;const campos=['dta_trajeto','dta_gps','dta_posicao','dta_evento','dta_atualizacao','dta_leitura','data','dataHora','dta'];for(const c of campos){if(t[c]){const d=new Date(t[c]);if(!isNaN(d))return d}}for(const c of Object.keys(t)){if(!/dta|data|hora|time/i.test(c))continue;const d=new Date(t[c]);if(!isNaN(d)&&d.getFullYear()>2000)return d}return null}
function normalizar(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim()}
function resolverFrente(eq){const candidatos=[eq.num_frente,eq.cod_frente,eq.frente,eq.dsc_frente,eq.descricao_frente,eq.nome_frente];for(const valor of candidatos){const n=parseInt(String(valor||'').replace(/\D/g,''));if(MAPA_FRENTES[n])return'FRENTE '+MAPA_FRENTES[n]}const descricao=String(eq.dsc_frente||eq.descricao_frente||eq.nome_frente||eq.frente||'').trim(),n=parseInt(descricao.replace(/\D/g,''));if(!isNaN(n))return'FRENTE '+n;return descricao}
function detectarOnline(eq,t){const valores=[eq.online,eq.ind_online,eq.flg_online,eq.status_online,eq.status_conexao,t.online,t.ind_online,t.flg_online,t.status_conexao];for(const valor of valores){if(valor===true||valor===1||/^(1|true|sim|online|conectado)$/i.test(String(valor)))return true;if(valor===false||valor===0||/^(0|false|nao|não|offline|desconectado)$/i.test(String(valor)))return false}return null}
function idadeMinutos(d){return d?Math.max(0,Math.floor((Date.now()-d.getTime())/60000)):Infinity}
function equipamentoVisivel(e){return true}
function converterEquipamento(eq){const t=trajetoAtual(eq),leitura=dataLeitura(t)||dataLeitura(eq),classe=eq.dsc_tipo_utilizacao||eq.tipo_utilizacao||eq.dsc_modelo||eq.dsc_equipamento||'SEM CLASSIFICAÇÃO';return{cod:eq.cod_equipamento||eq.equipamento,modelo:eq.dsc_modelo||eq.dsc_equipamento||eq.modelo||'-',nome:eq.nome||eq.dsc_operador||'-',classe,frente:resolverFrente(eq),vel:Number(t.num_velocidade_gps||eq.num_velocidade_gps||0),lat:eq.LATITUDE||eq.latitude||t.LATITUDE||t.latitude,lng:eq.LONGITUDE||eq.longitude||t.LONGITUDE||t.longitude,atividade:eq.dsc_atividade||eq.dsc_operacao||eq.operacao||t.dsc_atividade||null,parada:eq.dsc_motivo_parada||t.dsc_motivo_parada||null,inicio:eq.dta_inicial||null,leitura,online:detectarOnline(eq,t)}}
function estadoEq(e){const txt=(e.parada||'')+' '+(e.atividade||'');if(/manuten|oficina|mec[aâ]nic|el[eé]tric|corretiv|preventiv/i.test(txt))return{chave:'manutencao',nome:'Manutenção'};if(e.atividade&&!/aguard|parad|refei|abastec|troca|desloc|improdut/i.test(e.atividade))return{chave:'produtivo',nome:'Produtivo'};if(e.vel>.1)return{chave:'movimento',nome:'Em movimento'};return{chave:'parado',nome:e.parada||e.atividade?'Parado':'Sem apontamento'}}
const TIPOS={todos:{nome:'Todos',icone:'▦'},colhedora:{nome:'Colhedoras',icone:'🌾'},transbordo:{nome:'Transbordos',icone:'🚜'},agua:{nome:"Caminhão-d’água",icone:'💧'},caminhao:{nome:'Caminhões',icone:'🚛'},trator:{nome:'Tratores',icone:'⚙️'},apoio:{nome:'Outros',icone:'＋'}};
function tipoEquipamento(e){const classe=normalizar(e.classe),t=normalizar([e.classe,e.modelo,e.atividade].filter(Boolean).join(' '));if(String(e.cod)==='180722'||/trator|4x4/.test(classe))return'trator';if(/transbord/.test(t)||(/puma\s*(200|215|230)|magnum|t8\.?/.test(t)&&!/trator/.test(classe)))return'transbordo';if(/colhed|colheita|austoft|a8[0-9]{3}|ch\s?[0-9]{2,3}/.test(t))return'colhedora';if(/caminhao.{0,12}agua|agua|pipa/.test(t))return'agua';if(/caminhao|scania|volvo|mercedes|vw\s|constellation/.test(t))return'caminhao';if(/trator/.test(t))return'trator';return'apoio'}
function caminhaoEmCiclo(e){const s=normalizar([e.atividade,e.parada].filter(Boolean).join(' '));return /deslocamento\s+vazio.*(?:ate\s+)?(?:a\s+)?frente|(?:em\s+)?carregamento|aguardando.*carregar|deslocamento\s+carregado/.test(s)}
function passaFiltroOperacional(e){return tipoEquipamento(e)!=='caminhao'||caminhaoEmCiclo(e)}
function operacaoEq(e){if(e.atividade&&String(e.atividade).trim())return String(e.atividade).trim();const classe=String(e.classe||'').trim();if(classe&&classe!=='SEM CLASSIFICAÇÃO')return classe;return'Operação não informada pela Axiagro'}
function horaLeitura(d){if(!d)return'Horário não informado';const min=Math.max(0,Math.floor((Date.now()-d.getTime())/60000)),hora=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});return min<1?hora+' · agora':min<60?hora+' · há '+min+' min':hora+' · há '+Math.floor(min/60)+'h '+min%60+'min'}
function extrairCodigosTipos(payload){const lista=Array.isArray(payload)?payload:(payload.tipos||payload.data||payload.resultado||payload.results||[]),chaves=['cod_tipo_utilizacao','cod_tipo','codigo','cod','id','value'];return[...new Set((Array.isArray(lista)?lista:[]).map(item=>{if(typeof item==='number'||/^\d+$/.test(String(item)))return Number(item);if(!item||typeof item!=='object')return null;for(const [chave,valor] of Object.entries(item)){if(chaves.includes(normalizar(chave))&&/^\d+$/.test(String(valor)))return Number(valor)}return null}).filter(n=>Number.isFinite(n)))]}

async function carregar(){
  document.getElementById('atualizacao').textContent='Atualizando...';
  document.getElementById('grade').innerHTML='<div class="vazio">Buscando equipamentos...</div>';
  try{
    const tiposPadrao='tipo[]=11&tipo[]=12&tipo[]=123&tipo[]=126&tipo[]=31&tipo[]=51&tipo[]=52&tipo[]=53&tipo[]=54&tipo[]=61&tipo[]=101&tipo[]=102&tipo[]=103&tipo[]=104&tipo[]=106&tipo[]=107&tipo[]=109&tipo[]=1010&tipo[]=1011&tipo[]=1013&tipo[]=1014&tipo[]=1024&tipo[]=1025&tipo[]=1026&tipo[]=141&tipo[]=167&tipo[]=169&tipo[]=2323&tipo[]=273&tipo[]=281&tipo[]=291&tipo[]=3131';
    let tipos=tiposPadrao;
    try{const rt=await fetch(API+'/tipos',{headers:{Authorization:'Bearer '+token}});if(rt.ok){const codigos=extrairCodigosTipos(await rt.json());if(codigos.length)tipos=codigos.map(c=>'tipo[]='+encodeURIComponent(c)).join('&')}}catch(_){}
    const url=API+'/dashboard?'+tipos+'&atividades[]=0&eqpto=';
    const r=await fetch(url,{headers:{Authorization:'Bearer '+token}});
    if(r.status===401||r.status===403){localStorage.removeItem('qf-token');token='';document.getElementById('app').style.display='none';document.getElementById('inicio').style.display='grid';throw new Error('Sua sessão expirou. Entre novamente.')}
    if(!r.ok)throw new Error('Falha na consulta: '+r.status);
    const data=await r.json();
    let alocacao=Array.isArray(data.alocacao)?data.alocacao:[];
    // Complementa a consulta sem filtro de tipo para trazer todas as frentes cadastradas pela Axiagro.
    const consultasComplementares=[
      API+'/dashboard?'+tipos+'&eqpto=',
      API+'/dashboard?eqpto=',
      API+'/dashboard?atividades[]=0&eqpto=',
      API+'/dashboard?tipo[]=0&atividades[]=0&eqpto='
    ];
    for(const complementar of consultasComplementares){try{const resposta=await fetch(complementar,{headers:{Authorization:'Bearer '+token}});if(resposta.ok){const complemento=await resposta.json();for(const eq of (complemento.alocacao||[])){const chave=String(eq.cod_equipamento||'')+'|'+resolverFrente(eq);if(!alocacao.some(x=>String(x.cod_equipamento||'')+'|'+resolverFrente(x)===chave))alocacao.push(eq)}}}catch(_){}}
    // Consulta pontual complementar: a frente e a operação continuam vindo da Axiagro.
    for(const consulta180824 of [API+'/dashboard?eqpto=180824',API+'/dashboard?atividades[]=0&eqpto=180824',API+'/dashboard?'+tipos+'&eqpto=180824']){try{const resposta=await fetch(consulta180824,{headers:{Authorization:'Bearer '+token}});if(resposta.ok){const complemento=await resposta.json();alocacao=alocacao.concat(complemento.alocacao||complemento.equipamentos||complemento.data||[])}}catch(_){}}
    const todosConvertidos=alocacao.map(converterEquipamento);
    const porEquipamento=new Map();
    for(const e of todosConvertidos){const chave=String(e.cod||'')+'|'+e.frente,anterior=porEquipamento.get(chave),pontuar=x=>(x.frente?4:0)+(x.atividade?3:0)+(x.leitura?2:0)+(x.lat&&x.lng?1:0);if(!anterior||pontuar(e)>pontuar(anterior))porEquipamento.set(chave,e)}
    const convertidos=[...porEquipamento.values()];
    equipamentos=convertidos.filter(e=>e.frente&&equipamentoVisivel(e));
    frentesEncontradas=[...new Set(equipamentos.map(e=>e.frente).filter(Boolean))].sort(compararGrupos);
    renderFrentes();document.getElementById('atualizacao').textContent='100% da consulta · '+equipamentos.length+' equipamentos · atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){document.getElementById('grade').innerHTML='<div class="erro">⚠ '+e.message+'</div>';document.getElementById('atualizacao').textContent='Não atualizado'}
}

function renderFrentes(){
  const frentes=frentesEncontradas.length?frentesEncontradas:[...new Set(equipamentos.map(e=>e.frente))].sort(compararGrupos);
  document.getElementById('grade').innerHTML=frentes.length?frentes.map(f=>{const it=equipamentos.filter(e=>e.frente===f),prod=it.filter(e=>estadoEq(e).chave==='produtivo').length,man=it.filter(e=>estadoEq(e).chave==='manutencao').length,mov=it.filter(e=>estadoEq(e).chave==='movimento').length,par=it.filter(e=>estadoEq(e).chave==='parado').length;return`<button class="frente" onclick="abrirFrente('${String(f).replace(/'/g,"\\'")}')"><b>${nomeFrente(f)}</b><small>${it.length} equipamento${it.length===1?'':'s'}</small><span class="estado"><span class="on">● ${prod} produtivo${prod===1?'':'s'}</span><span class="manut">● ${man} manutenção</span><span style="color:#77c7ff">● ${mov} movimento</span><span class="off">● ${par} parado${par===1?'':'s'}</span></span><span class="seta">Abrir operação →</span></button>`}).join(''):'<div class="vazio">Nenhuma frente encontrada.</div>'
}
async function pesquisarEquipamento(){const campo=document.getElementById('pesquisa-equip'),msg=document.getElementById('pesquisa-msg'),codigo=String(campo.value||'').replace(/\D/g,'');msg.textContent='';if(!codigo){msg.textContent='Digite o número do equipamento.';campo.focus();return}let e=equipamentos.find(x=>String(x.cod).replace(/\D/g,'')===codigo);if(!e){msg.textContent='Consultando a Axiagro...';try{const resposta=await fetch(API+'/dashboard?eqpto='+codigo,{headers:{Authorization:'Bearer '+token}});if(resposta.ok){const dados=await resposta.json(),lista=dados.alocacao||dados.equipamentos||dados.data||[];const novos=(Array.isArray(lista)?lista:[lista]).map(converterEquipamento).filter(x=>x.frente);for(const novo of novos){if(!equipamentos.some(x=>String(x.cod)===String(novo.cod)&&x.frente===novo.frente))equipamentos.push(novo)}frentesEncontradas=[...new Set(equipamentos.map(x=>x.frente).filter(Boolean))].sort(compararGrupos);e=equipamentos.find(x=>String(x.cod).replace(/\D/g,'')===codigo)}}catch(_){}}if(!e){msg.textContent='Equipamento '+codigo+' não encontrado nos dados retornados pela Axiagro.';return}msg.textContent='';equipamentoDestacado=String(e.cod);abrirFrente(e.frente);filtroOperacaoAtual=operacaoEq(e);filtroTipoAtual='todos';renderOperacoes();renderTipos();renderEquipamentos();setTimeout(()=>document.getElementById('equip-'+codigo)?.scrollIntoView({behavior:'smooth',block:'center'}),80)}

function abrirFrente(frente){
  frenteAtual=frente;filtroOperacaoAtual='todas';filtroTipoAtual='todos';document.getElementById('visao-frentes').style.display='none';document.getElementById('visao-equip').style.display='block';document.getElementById('nome-frente').textContent=nomeFrente(frente);renderOperacoes();renderTipos();renderEquipamentos();
}
function renderOperacoes(){const itens=equipamentos.filter(e=>e.frente===frenteAtual),operacoes=[...new Set(itens.map(operacaoEq))].sort((a,b)=>a.localeCompare(b,'pt-BR'));document.getElementById('operacao-filtros').innerHTML=`<button class="operacao-btn ${filtroOperacaoAtual==='todas'?'ativo':''}" onclick="filtrarOperacao('todas')">▦ Todas<span class="qtd">${itens.length}</span></button>`+operacoes.map(op=>{const n=itens.filter(e=>operacaoEq(e)===op).length,cod=encodeURIComponent(op);return`<button class="operacao-btn ${filtroOperacaoAtual===op?'ativo':''}" onclick="filtrarOperacao(decodeURIComponent('${cod}'))">⚙ ${op}<span class="qtd">${n}</span></button>`}).join('')}
function filtrarOperacao(operacao){filtroOperacaoAtual=operacao;filtroTipoAtual='todos';renderOperacoes();renderTipos();renderEquipamentos()}
function renderTipos(){let itens=equipamentos.filter(e=>e.frente===frenteAtual);if(filtroOperacaoAtual!=='todas')itens=itens.filter(e=>operacaoEq(e)===filtroOperacaoAtual);const totalFrente=equipamentos.filter(e=>e.frente===frenteAtual).length,ordem=['todos','colhedora','transbordo','agua','caminhao','trator','apoio'];document.getElementById('qtd-frente').textContent=totalFrente+' equipamento'+(totalFrente===1?'':'s');document.getElementById('tipo-filtros').innerHTML=ordem.filter(k=>k==='todos'||itens.some(e=>tipoEquipamento(e)===k)).map(k=>{const n=k==='todos'?itens.length:itens.filter(e=>tipoEquipamento(e)===k&&(k!=='caminhao'||caminhaoEmCiclo(e))).length,t=TIPOS[k];return`<button class="tipo-btn ${filtroTipoAtual===k?'ativo':''}" onclick="filtrarTipo('${k}')">${t.icone} ${t.nome}<span class="qtd">${n}</span></button>`}).join('')}
function filtrarTipo(tipo){filtroTipoAtual=tipo;renderTipos();renderEquipamentos()}
function renderEquipamentos(){let itens=equipamentos.filter(e=>e.frente===frenteAtual);if(filtroOperacaoAtual!=='todas')itens=itens.filter(e=>operacaoEq(e)===filtroOperacaoAtual);if(filtroTipoAtual!=='todos')itens=itens.filter(e=>tipoEquipamento(e)===filtroTipoAtual&&(filtroTipoAtual!=='caminhao'||caminhaoEmCiclo(e)));itens.sort((a,b)=>String(a.cod).localeCompare(String(b.cod)));document.getElementById('lista').innerHTML=itens.map(e=>{const st=estadoEq(e),fazendo=e.parada||e.atividade||(e.vel>.1?'Em deslocamento':'Sem atividade apontada'),con=e.online===true?{c:'online',n:'Online'}:{c:'recente',n:'Offline'},codigo=String(e.cod).replace(/\D/g,'');return`<article id="equip-${codigo}" class="equip ${st.chave} ${String(e.cod)===equipamentoDestacado?'destaque':''}"><div class="equip-info"><b>${e.cod}</b><div>${e.modelo} · ${e.nome}</div><span class="status-tag ${st.chave}">${st.nome}</span><span class="conexao-tag ${con.c}">${con.n}</span><div class="atividade">${fazendo}</div><div class="vel">${e.vel.toFixed(1)} km/h</div><div class="leitura">🕐 Atualização: ${horaLeitura(e.leitura)}</div></div><button class="local" ${e.lat&&e.lng?'':'disabled'} onclick="localizar(${e.lat||'null'},${e.lng||'null'})">📍 Localização</button></article>`}).join('')||'<div class="vazio">Nenhum equipamento desta operação e categoria.</div>'}
function voltar(){document.getElementById('visao-equip').style.display='none';document.getElementById('visao-frentes').style.display='block'}
function localizar(lat,lng){if(!lat||!lng)return;window.open('https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng+'&travelmode=driving','_blank')}
</script>
